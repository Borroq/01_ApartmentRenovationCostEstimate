<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

    <link rel="icon" href="/static/images/favicon.ico" type="image/x-icon">
    <title th:text="${title}"></title>

    <link rel="stylesheet" href="/static/css/styles.css" type="text/css"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4" crossorigin="anonymous"></script>
</head>


<body>
    <div class="header">
        <h1>List of products in the cart</h1>
    </div>


    <!--==================================MENU BUTTON========================================-->
    <!--Switching between sections-->
    <div class="container">
        <h2>Browse:</h2>
        <a th:href="@{/home}" class="btn btn-primary btn-sm mb-3" >Home</a>
        <a th:href="@{/users}" class="btn btn-primary btn-sm mb-3" >Users</a>
        <a th:href="@{/products}" class="btn btn-primary btn-sm mb-3" >Products</a>
        <a th:href="@{/rooms}" class="btn btn-primary btn-sm mb-3" >Rooms</a>
        <a th:href="@{/login}" class="btn btn-primary btn-sm mb-3" style="display: none;">Login</a>
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="btn btn-danger btn-sm mb-3">Logout</button>
        </form>
    </div>


    <!--List of carts with products-->
    <div class="container">
        <div class="table-responsive" style="max-height: 600px; overflow-y: auto;">

            <table style="width:95%" border="2"
                   class="table table-striped table-bordered border-primary mx-auto">

                <thead class="table-dark">
                    <tr>
                        <th scope="col">User name</th>
                        <th scope="col">Cart ID</th>
                        <th scope="col">Name</th>
                        <th scope="col">Quantity</th>
                        <th scope="col">Total Cost</th>
                        <th scope="col">Views</th>
                    </tr>
                </thead>

                <tbody class="colorText">
                    <tr th:each="cart : ${carts}">
                        <div class="d-grid gap-2">
                            <td th:text="${cart.user.name}"></td>
                        </div>
                        <td th:text="${cart.id}"></td>
                        <td th:text="${cart.name}"></td>
                        <td th:text="${cart.cartItemsCount}"></td>
                        <td th:text="${cart.totalCost}"></td>
                        <td>

                            <div class="d-grid gap-2">
                                <a th:href="@{/api/carts}" class="btn btn-info btn-sm">view details</a>
                                <a th:href="@{'/carts/cart-details/' + ${cart.id}}" class="btn btn-primary btn-sm mb-3" >Go to the Cart</a>
                                <button class="btn btn-danger btn-sm" th:attr="onclick='deleteElement(\'' + ${cart.id} + '\',\'' + 'carts' + '\')'" >delete</button>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!--==================================PAGINATION NAV========================================-->

    <nav aria-label="Page navigation" class="mt-4">
        <ul class="pagination justify-content-center">
            <!-- Previous page -->
            <li class="page-item" th:classappend="${pageMetadata.pageNumber == 0} ? 'disabled'">
                <a class="page-link" th:href="@{/carts(page=${pageMetadata.pageNumber - 1}, size=${pageMetadata.pageSize})}">Previous</a>
            </li>

            <!-- Page numbers -->
            <li class="page-item" th:each="pageNum : ${#numbers.sequence(0, pageMetadata.totalPages - 1)}"
                th:classappend="${pageNum == pageMetadata.pageNumber} ? 'active'">
                <a class="page-link" th:href="@{/carts(page=${pageNum}, size=${pageMetadata.pageSize})}" th:text="${pageNum + 1}"></a>
            </li>

            <!-- Next page -->
            <li class="page-item" th:classappend="${pageMetadata.pageNumber == pageMetadata.totalPages - 1} ? 'disabled'">
                <a class="page-link" th:href="@{/carts(page=${pageMetadata.pageNumber + 1}, size=${pageMetadata.pageSize})}">Next</a>
            </li>
        </ul>
    </nav>



    <!--==================================DELETING AN ELEMENT========================================-->
    <script>
        function deleteElement(elementId, name) {
            if (confirm('Are you sure you want to delete this element?')) {
                fetch('/api/' + name + '/' + elementId, {method: 'DELETE'})
                    .then(response => {
                    if (response.ok) {
                        alert('Element successfully deleted');
                        location.reload();
                    }else {
                        alert('Failed to delete element');
                    }
                });
            }
        }
    </script>


    <!--=============================FLEXBOX WITH FORM=============================================-->

    <!--FLEXBOX-->
    <div class="container">
        <div class="d-flex justify-content-around">

            <!-- FORM FOR CREATING A NEW CART-->
            <div class="container">
                <h2>Create new cart.</h2>

                <form id="createCartForm">
                    <div class="mb-3 row">
                        <div class="col-sm-2">
                            <label for="userId" class="col-form-lable">User ID</label>
                        </div>
                        <div class="col-sm-5">
                            <input type="number" class="form-control" id="userId" name="userId" required>
                        </div>
                    </div>

                    <div class="mb-3 row">
                        <div class="col-sm-2">
                            <label for="name" class="col-form-lable">Cart name</label>
                        </div>
                        <div class="col-sm-5">
                            <input type="text" class="form-control" id="name" name="name" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary btn-sm mb-3">Create Cart</button>

                </form>
            </div>


            <!-- FORM FOR ADDING PRODUCTS TO CART-->
            <div class="container">
                <h2>Add new product to cart.</h2>

                <form id="addProductForm">
                    <div class="mb-3 row">
                        <div class="col-sm-2">
                            <label for="cartId" class="col-form-label">Cart ID</label>
                        </div>
                        <div class="col-sm-5">
                            <input type="number" class="form-control" id="cartId" name="cartId" value="1">
                        </div>
                    </div>

                    <div class="mb-3 row">
                        <div class="col-sm-2">
                            <label for="productId" class="col-form-label">Product ID</label>
                        </div>
                        <div class="col-sm-5">
                            <input type="number" class="form-control" id="productId" name="productId" value="2">
                        </div>
                    </div>

                    <div class="mb-3 row">
                        <div class="col-sm-2">
                            <label for="quantity" class="col-form-label">Quantity</label>
                        </div>
                        <div class="col-sm-5">
                            <input type="number" class="form-control" id="quantity" name="quantity" value="1">
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary btn-sm mb-3">Add product to Cart</button>

                </form>
            </div>

        </div>
    </div>


    <!--==================================SCRIPT FOR CREATING A NEW CART========================================-->
    <script>
        document.getElementById('createCartForm').addEventListener('submit', function(event) {
            event.preventDefault();

            const userId = document.getElementById('userId').value;
            const name = document.getElementById('name').value;

            fetch('/api/carts', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body:JSON.stringify({userId: userId, name: name})
            })
            .then(response => {
                if (response.ok) {
                    return response.json();
                } else {
                    alert('Failed to create cart');
                    throw new Error('Failed to create cart');
                }
            })
            .then(data => {
                console.log('Received response:', data);
                alert('Cart created with ID: ' + data.data.id);
                console.log(data);
                location.reload()
                // Możesz zaktualizować UI lub przekierować użytkownika na stronę koszyka
            })
            .catch(error => {
                console.error('Error: ', error);
                alert('An error during with creating the cart');
            });
        });
    </script>


    <!--==================================SCRIPT FOR ADDING PRODUCTS TO CART========================================-->
    <script>
        document.getElementById('addProductForm').addEventListener('submit', function(event) {
            event.preventDefault(); // zapobiega domyślnemu wysłaniu formularza

            const form = this;
            const cartId = document.getElementById('cartId').value;
            const productId = document.getElementById('productId').value;
            const quantity = document.getElementById('quantity').value;

            <!--DODATKOWE LOGI, ABY UPEWNIC SIE, CZY FETCH JEST POPRAWNIE KONFIGUROWANY-->
            console.log(`Sending request to: /api/carts/${cartId}/products`);
            console.log(`Data: { productId: ${productId}, quantity: ${quantity} }`);

            fetch(`/api/carts/${cartId}/products?quantity=${quantity}`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({productId: productId, quantity: quantity})
            })
            .then(response => {
                console.log('Response Status:', response.status);
                return response.text().then(text => {
                    console.log('Response Text:', text);
                    if (response.ok) {
                        return JSON.parse(text);
                    } else {
                        alert('Failed add product to cart');
                    }
                });
            })
            .then(data => {
                console.log('Response Data: ', data);
                alert('Product added to cart');
                <!--form.reset(); // resetuje formularz-->
                location.reload();
            })
            .catch(error => {
                console.error('Error:', error);
                alert('An error occurred while adding the product to the cart');
            });
        });
    </script>


    <!-- Wysyłanie zapytania restowego do API -> wykorzystując skrypt JavaScript-->
    <script src="/js/scripts.js"></script> <!-- Dodanie linku do pliku JavaScript -->

</body>
</html>
