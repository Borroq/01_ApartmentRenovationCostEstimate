<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
     <!-- <title th:text="${title}">Title</title> -->
    <title th:text="${title}"></title>

    <link rel="stylesheet" href="styles.css" type="text/css"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4" crossorigin="anonymous"></script>
</head>
<body>
    <div class="header">
        <h1 th:text="${title}"></h1>
    </div>

    <div class="container">
        <h2>Browse:</h2>
        <a th:href="@{/users}" class="btn btn-primary btn-sm mb-3" >Users</a>
        <a th:href="@{/products}" class="btn btn-primary btn-sm mb-3" >Products</a>
        <a th:href="@{/rooms}" class="btn btn-primary btn-sm mb-3" >Rooms</a>
        <a th:href="@{/carts}" class="btn btn-primary btn-sm mb-3" >Carts</a>
    </div>

    <!--PROBA STWORZENIA OPCJI BACKUP/RESTORE DATABASE ->  BACKUP DZIAŁĄ. -->

    <div class="container">
        <h2>Backup and Restore Database</h2>
        <div class="d-flex justify-content-around">
            <div class="container">
                <h3>Backup Database</h3>
                <button class="btn btn-success btn-sm" onclick="createBackup()">Create Backup</button>
            </div>

            <div class="container">
                <h3>Choose backup file to restore Database</h3>
                <form id="backupFileForm">
                    <select id="backupFile" name="backupName">
                        <option value="none">None</option>
                    </select>
                    <button type="submit" class="btn btn-success btn-sm mb-3">Restore Backup</button>
                </form>
            </div>
        </div>
    </div>


<!-- ==================== BACKUP DATABASE ==================== -->
    <script>
        function createBackup() {
            if (confirm('Are you sure you want to create backup database?')) {
                fetch('/api/database/backup', {method: 'POST'})
                .then(response => {
                    if (response.ok) {
                        alert('Backup created successfully!');
                        location.reload();
                    } else {
                        alert('Failed create the backup');
                    }
                })
            }
        }
    </script>

<!-- ==================== READ BACKUP LIST ==================== -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            fetch('/api/database/backups')
            .then(response => {
                if(!response.ok) {
                    throw new Error('Failed to fetch backups')
                }
                return response.json();
            })
            .then(backupFileNames => {
                const selectElement = document.getElementById('backupFile');
                backupFileNames.forEach(backupFileName => {
                    const option = document.createElement('option');
                    option.value = backupFileName;
                    option.text = backupFileName;
                    selectElement.appendChild(option);
                })
            })
            .catch(error => {
                console.error('Error loading backups:', error);
            })
        })
    </script>

    <!-- ==================== RESTORE BACKUP ==================== -->
    <script>
        document.getElementById('backupFileForm').addEventListener('submit', function(event) {
            event.preventDefault();

            const backupFileName = document.getElementById('backupFile').value;

            if (backupFileName === "none")  {
                location.reload();
                return; // Zatrzymaj funkcję, jeśli nie wybrano poprawnego pliku
            } else {
                fetch(`/api/database/restore/${backupFileName}`, {
                    method: 'POST'
                })
                .then(response => {
                    console.log('Raw response:', response);
                    if(!response.ok) {
                        throw new Error('Network response was not ok: ' + response.statusText);
                    }
                    return response.json();
                })
                .then(data => {
                    alert(data.message); // Przykład wyświetlania wiadomości zwrotnej
                })
                .catch(error => {
                    console.error('Error loading backups:', error);
                })
            }
        })
    </script>

 </body>
 </html>
