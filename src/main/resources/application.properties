spring.application.name=ApartmentRenovationCostEstimate

# Uzyto zmienna srodowiskowa MYSQL_HOST, która ma domyslna wartosc "localhost". Pozwala to na wieksza elastycznosc i przenosnosc aplikacji.
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:3306/apartment_renovation
spring.datasource.username= root
spring.datasource.password=
###spring.security.user.name=Borroq
###spring.security.user.password=12345
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.datasource.initialize= true
spring.datasource.initialization-mode=always
#spring.batch.jdbc.initialize-schema=always
spring.sql.init.mode=always
spring.jpa.show-sql= true

#Ustawienie sciezki dla obslugi zasobow statycznch. Mowi gdzie aplikacja bedzie szukala zasobow statycznych
spring.mvc.static-path-pattern=/static/**

#Generuje unikalny identyfikator (hash) dla kazdego zasobu statycznego.
spring.web.resources.chain.strategy.content.enabled=true

#Automatyczne mapowanie zasobow statycznych
spring.web.resources.add-mappings=true


